{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мулти-функционални Калкулатори</title>
    <link rel="stylesheet" href="{% static 'css/calculatorStyle.css' %}">
</head>
<body>
 <!-- Горна лента с бутон за начална страница -->
    <div class="nav-bar">
        <a href="{% url 'home' %}" class="btn-home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Начална страница
        </a>
    </div>

    <header>
        <h1>Универсални Калкулатори</h1>
        <p>Четири полезни инструмента за бързи изчисления на едно място</p>
    </header>

    <main class="calculators-container">

        <!-- Секция 1: Събиране -->
        <section class="calc-card">
            <div class="calc-icon">➕</div>
            <h2>Брой изстрели с един резервоар</h2>
            <div class="input-group">
                <label for="add-num1">Първо число:</label>
                <input type="number" id="add-num1" placeholder="Въведете число">
            </div>
            <div class="input-group">
                <label for="add-num2">Второ число:</label>
                <input type="number" id="add-num2" placeholder="Въведете число">
            </div>
            <div class="input-group">
                <label for="add-num3">Трето число:</label>
                <input type="number" id="add-num3" placeholder="Въведете число">
            </div>
            <div class="input-group">
                <label for="add-result">Резултат:</label>
                <input type="text" id="add-result" readonly placeholder="0">
            </div>
            <button onclick="calculateAddition()">Изчисли</button>
        </section>

        <!-- Сеокция 2: Джаули -->
        <section class="calc-card">
            <div class="calc-icon">📊</div>
            <h2>Изчисли енергия в джаули</h2>
            <div class="input-group">
                <label for="pct-num">Тегло на чашката в грамове:</label>
                <input type="number" id="pct-num" placeholder="Въведи положително число" min="0">
            </div>
            <div class="input-group">
                <label for="pct-rate">Скорост м/с:</label>
                <input type="number" id="pct-rate" placeholder="Въведете скорост м/с">
            </div>
            <div class="input-group">
                <label for="pct-result">Резултат:</label>
                <input type="text" id="pct-result" readonly placeholder="0">
            </div>
            <button onclick="calculatePercentage()">Изчисли</button>
        </section>

        <!-- Секция 3: Лице на правоъгълник -->
        <section class="calc-card">
            <div class="calc-icon">📐</div>
            <h2>Лице на правоъгълник</h2>
            <div class="input-group">
                <label for="area-a">Страна А (см):</label>
                <input type="number" id="area-a" placeholder="Дължина">
            </div>
            <div class="input-group">
                <label for="area-b">Страна Б (см):</label>
                <input type="number" id="area-b" placeholder="Ширина">
            </div>
            <div class="input-group">
                <label for="area-result">Площ (кв. см):</label>
                <input type="text" id="area-result" readonly placeholder="0">
            </div>
            <button onclick="calculateArea()">Изчисли</button>
        </section>

        <!-- Секция 4: Индекс на телесна маса (ИТМ) -->
        <section class="calc-card">
            <div class="calc-icon">⚖️</div>
            <h2>Телесна маса (ИТМ)</h2>
            <div class="input-group">
                <label for="bmi-weight">Тегло (кг):</label>
                <input type="number" id="bmi-weight" placeholder="Например: 70">
            </div>
            <div class="input-group">
                <label for="bmi-height">Ръст (см):</label>
                <input type="number" id="bmi-height" placeholder="Например: 175">
            </div>
            <div class="input-group">
                <label for="bmi-result">Вашият ИТМ:</label>
                <input type="text" id="bmi-result" readonly placeholder="0">
            </div>
            <button onclick="calculateBMI()">Изчисли</button>
        </section>

    </main>

    <!-- Логика за изчисленията -->
    <script src="{% static 'js/calculators.js' %}"></script>
</body>
</html>
